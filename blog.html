<!DOCTYPE html>
<html lang="en-GB">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Adventures Blog | Newquay Sundown Walks</title>
    <link rel="icon" href="images/sundown-walks-logo.webp">
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@300;400;600&family=Outfit:wght@300;500;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <canvas id="starsCanvas"></canvas>

    <div class="menu-overlay"></div>

    <header>
        <nav>
            <div class="logo-container">
                <a href="index.html"><img src="images/sundown-walks-logo.webp" alt="Logo" class="logo-img"></a>
            </div>
            <div class="nav-right">
                <button id="themeToggle" class="theme-toggle-btn"><span class="icon">🌙</span></button>
                
                <button class="hamburger" aria-label="Open Menu">☰</button>

                <ul class="nav-links">
                    <li><a href="index.html">Home</a></li>
                    <li><a href="index.html#services">Adventures</a></li>
                    <li><a href="#" class="active">Blog</a></li>
                    <li><a href="index.html#contact" class="nav-cta">Book Now</a></li>
                </ul>
            </div>
        </nav>
    </header>

    <main>
        <section class="hero blog-hero">
            <div class="container hero-container">
                <div class="hero-content">
                    <span class="hero-tag">Cornish Tales</span>
                    <h1>The Pack Blog</h1>
                    <p class="subtitle">Stories from the trails, tips for owners, and highlights from our weekend adventures.</p>
                    
                    <div class="blog-search-wrapper premium-glass">
                        <input type="text" id="searchInput" placeholder="Search for adventures..." onkeyup="filterBlogs()">
                        <span class="search-icon">🔍</span>
                    </div>
                </div>
            </div>
        </section>

        <section class="blog-feed">
            <div class="container">
                <div id="blogGrid" class="blog-grid">
                    </div>
                <p id="noResults" style="text-align:center; display:none; color:var(--text-muted);">No adventures found matching that search.</p>
            </div>
        </section>
    </main>

    <footer>
        <div class="container">
            <div class="footer-content">
                <img src="images/sundown-walks-logo.webp" alt="Logo" class="footer-logo">
                <p>&copy; 2025 Newquay Sundown Walks.</p>
            </div>
        </div>
    </footer>

    <script src="posts/blog-data.js"></script> 
    
    <script>
        // --- RENDER BLOGS ---
        const grid = document.getElementById('blogGrid');
        
        function renderPosts(posts) {
            grid.innerHTML = ''; // Clear current
            if(posts.length === 0) {
                document.getElementById('noResults').style.display = 'block';
                return;
            } else {
                document.getElementById('noResults').style.display = 'none';
            }

            posts.forEach(post => {
                const article = document.createElement('article');
                article.className = 'blog-card premium-glass';
                article.innerHTML = `
                    <div class="blog-img-wrapper">
                        <img src="${post.image}" alt="${post.title}" loading="lazy">
                        <span class="blog-category">${post.category}</span>
                    </div>
                    <div class="blog-content">
                        <span class="blog-date">${new Date(post.date).toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' })}</span>
                        <h3>${post.title}</h3>
                        <p>${post.snippet}</p>
                        <a href="${post.link}" class="text-link">Read Story →</a>
                    </div>
                `;
                grid.appendChild(article);
            });
        }

        // --- SEARCH FUNCTION ---
        function filterBlogs() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            const filtered = blogPosts.filter(post => 
                post.title.toLowerCase().includes(query) || 
                post.snippet.toLowerCase().includes(query) ||
                post.category.toLowerCase().includes(query)
            );
            renderPosts(filtered);
        }

        // Initial Load
        // Check if blogPosts exists (loaded from script)
        if(typeof blogPosts !== 'undefined') {
            // Sort by date new to old
            blogPosts.sort((a,b) => new Date(b.date) - new Date(a.date));
            renderPosts(blogPosts);
        }

        // --- DARK MODE & STARS (Reused Logic) ---
        const themeBtn = document.getElementById('themeToggle');
        if (themeBtn) {
            const iconSpan = themeBtn.querySelector('.icon');
            if (localStorage.getItem('theme') === 'dark') {
                document.body.classList.add('dark-mode');
                iconSpan.textContent = '☀️';
            }
            themeBtn.addEventListener('click', () => {
                document.body.classList.toggle('dark-mode');
                const isDark = document.body.classList.contains('dark-mode');
                iconSpan.textContent = isDark ? '☀️' : '🌙';
                localStorage.setItem('theme', isDark ? 'dark' : 'light');
                if(isDark && typeof animate === 'function') animate();
            });
        }
        
        const canvas = document.getElementById('starsCanvas');
        if(canvas) {
            const ctx = canvas.getContext('2d');
            let stars = [];
            function resizeCanvas() { canvas.width = window.innerWidth; canvas.height = document.documentElement.scrollHeight; }
            class Star {
                constructor() { this.reset(); this.y = Math.random() * canvas.height; }
                reset() { this.x = Math.random() * canvas.width; this.y = Math.random() * canvas.height; this.size = Math.random() * 2; this.opacity = Math.random(); }
                draw() {
                    ctx.fillStyle = `rgba(255, 255, 255, ${this.opacity})`;
                    ctx.beginPath(); ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2); ctx.fill();
                }
            }
            function initStars() { stars = Array(150).fill().map(() => new Star()); }
            function animate() {
                if(!document.body.classList.contains('dark-mode')) return;
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                stars.forEach(s => s.draw());
                requestAnimationFrame(animate);
            }
            resizeCanvas(); initStars(); 
            if (document.body.classList.contains('dark-mode')) animate();
            window.addEventListener('resize', () => { resizeCanvas(); initStars(); });
        }

        // --- MOBILE MENU LOGIC (Updated with Overlay & Scroll Lock) ---
        const hamburger = document.querySelector('.hamburger');
        const navLinks = document.querySelector('.nav-links');
        const overlay = document.querySelector('.menu-overlay');
        const links = document.querySelectorAll('.nav-links li a');
        const body = document.body;

        function toggleMenu() {
            const isActive = navLinks.classList.contains('active');
            
            if (!isActive) {
                // Open Menu
                navLinks.classList.add('active');
                overlay.classList.add('active');
                hamburger.textContent = '✕';
                body.classList.add('no-scroll');
            } else {
                // Close Menu
                navLinks.classList.remove('active');
                overlay.classList.remove('active');
                hamburger.textContent = '☰';
                body.classList.remove('no-scroll');
            }
        }

        if(hamburger) {
            hamburger.addEventListener('click', toggleMenu);
            overlay.addEventListener('click', toggleMenu);

            // Close when clicking a link
            links.forEach(link => {
                link.addEventListener('click', () => {
                    if(navLinks.classList.contains('active')) toggleMenu();
                });
            });
        }
    </script>
</body>
</html>
