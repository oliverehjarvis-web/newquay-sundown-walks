<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blog Creator | Admin</title>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600&family=Outfit:wght@500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <style>
        body { padding-bottom: 50px; }
        #loginOverlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #0B131E; z-index: 9999; display: flex; align-items: center; justify-content: center; flex-direction: column; }
        .creator-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 40px; margin-top: 40px; }
        .tool-panel { background: white; padding: 30px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); margin-bottom: 30px; }
        .input-group { margin-bottom: 20px; text-align: left; }
        label { display: block; font-weight: 700; margin-bottom: 8px; color: #526C83; }
        input, textarea, select { width: 100%; padding: 12px; border: 2px solid #eee; border-radius: 10px; font-family: 'Nunito'; font-size: 1rem; box-sizing: border-box; }
        input:focus, textarea:focus { border-color: #F0B45D; outline: none; }
        .ai-output, .code-output { background: #f8f9fa; padding: 15px; border-radius: 10px; font-family: monospace; font-size: 0.85em; border: 1px dashed #ccc; margin-top: 10px; cursor: pointer; word-break: break-all; }
        .preview-area { border: 2px dashed #ccc; padding: 20px; min-height: 400px; border-radius: 20px; margin-top: 20px; background: #FEF6DF; }
        
        .template-visual img { width: 100%; height: 400px; object-fit: cover; border-radius: 20px; margin-bottom: 20px; }
        .template-standard img { float: left; width: 40%; margin-right: 20px; margin-bottom: 20px; border-radius: 20px; }
        .clearfix::after { content: ""; clear: both; display: table; }
    </style>
</head>
<body>

    <div id="loginOverlay">
        <h2 style="color:white; margin-bottom:20px;">Sundown Admin</h2>
        <input type="password" id="passwordInput" placeholder="Enter Password" style="width: 300px; text-align: center;">
        <button onclick="checkPass()" class="cta-button primary" style="margin-top: 20px;">Unlock</button>
    </div>

    <div class="container" style="display:none;" id="adminContent">
        <div class="section-header">
            <h1>Blog Post Creator</h1>
            <p>Generate prompts, build posts, and get your index code.</p>
        </div>

        <div class="creator-grid">
            
            <div class="left-col">
                
                <div class="tool-panel premium-glass">
                    <h3>🤖 1. AI Idea Assistant</h3>
                    <div class="input-group">
                        <label>Topic</label>
                        <input type="text" id="aiTopic" placeholder="e.g. Rainy day walk">
                    </div>
                    <div class="input-group">
                        <label>Highlights</label>
                        <input type="text" id="aiPoints" placeholder="e.g. muddy paws, fun">
                    </div>
                    <button onclick="generatePrompt()" class="cta-button secondary" style="width:100%">Generate Prompt</button>
                    <div id="promptOutput" class="ai-output" style="display:none;" title="Click to Copy" onclick="copyText('promptOutput')"></div>
                </div>

                <div class="tool-panel premium-glass">
                    <h3>✍️ 2. Build Post</h3>
                    <div class="input-group">
                        <label>Title</label>
                        <input type="text" id="postTitle" oninput="updatePreview()">
                    </div>
                    <div class="input-group">
                        <label>Date</label>
                        <input type="date" id="postDate" oninput="updatePreview()">
                    </div>
                    <div class="input-group">
                        <label>Category</label>
                        <select id="postCategory" onchange="updatePreview()">
                            <option value="Adventure">Adventure</option>
                            <option value="Tips">Tips</option>
                            <option value="Pack Life">Pack Life</option>
                            <option value="News">News</option>
                        </select>
                    </div>
                    <div class="input-group">
                        <label>Main Image Path</label>
                        <input type="text" id="postImage" placeholder="../images/..." value="../images/" oninput="updatePreview()">
                    </div>
                    <div class="input-group">
                        <label>Short Snippet (for the card)</label>
                        <textarea id="postSnippet" rows="2" oninput="updatePreview()"></textarea>
                    </div>
                    <div class="input-group">
                        <label>Full Content (HTML allowed)</label>
                        <textarea id="postContent" rows="8" oninput="updatePreview()"></textarea>
                    </div>
                    <button onclick="downloadHTML()" class="cta-button primary" style="width:100%;">⬇️ Download HTML File</button>
                </div>

                <div class="tool-panel premium-glass" style="border: 2px solid var(--gold);">
                    <h3>📂 3. Update Index</h3>
                    <p style="font-size:0.9em; margin-bottom:10px;">Copy this and add it to the list in <code>posts/blog-data.js</code></p>
                    <div id="jsonOutput" class="code-output" onclick="copyText('jsonOutput')" title="Click to Copy">
                        Fill in details above to see code here...
                    </div>
                </div>
            </div>

            <div class="right-col">
                <h3>Live Preview</h3>
                <div id="livePreview" class="preview-area"></div>
            </div>
        </div>
    </div>

    <script>
        function checkPass() {
            if(document.getElementById('passwordInput').value === "newquaydogs") {
                document.getElementById('loginOverlay').style.display = 'none';
                document.getElementById('adminContent').style.display = 'block';
            } else alert("Incorrect");
        }

        function generatePrompt() {
            const topic = document.getElementById('aiTopic').value;
            const points = document.getElementById('aiPoints').value;
            const prompt = `Write a blog post for a Dog Walking business. Topic: ${topic}. Key details: ${points}. Use British English. Format as HTML paragraphs.`;
            const out = document.getElementById('promptOutput');
            out.innerText = prompt;
            out.style.display = 'block';
        }

        function copyText(id) {
            const text = document.getElementById(id).innerText;
            navigator.clipboard.writeText(text);
            alert("Copied to clipboard!");
        }

        function updatePreview() {
            const title = document.getElementById('postTitle').value || "Title";
            const date = document.getElementById('postDate').value || "Date";
            const img = document.getElementById('postImage').value;
            const content = document.getElementById('postContent').value || "Content...";
            const snippet = document.getElementById('postSnippet').value;
            const category = document.getElementById('postCategory').value;
            const slug = title.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/(^-|-$)+/g, '');

            // 1. Render Preview
            // Note: fixing image path for preview vs real life
            // In real file it is "../images/", in preview it might be "images/"
            const previewImg = img.replace('../', ''); 
            
            const html = `
                <div class="template-visual">
                    <img src="${previewImg}" alt="Blog Image">
                    <span style="color:var(--gold); font-weight:700;">${date} | ${category}</span>
                    <h1 style="color:var(--primary); margin-top:10px;">${title}</h1>
                    <div class="blog-text" style="margin-top:20px; line-height:1.8;">${content}</div>
                </div>
            `;
            document.getElementById('livePreview').innerHTML = html;

            // 2. Generate JSON Snippet
            const json = `
    {
        id: "${slug}",
        title: "${title}",
        date: "${date}",
        category: "${category}",
        image: "${previewImg}", 
        snippet: "${snippet}",
        link: "posts/${slug}.html"
    },`;
            document.getElementById('jsonOutput').innerText = json;
        }

        function downloadHTML() {
            const title = document.getElementById('postTitle').value;
            const slug = title.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/(^-|-$)+/g, '');
            const content = document.getElementById('livePreview').innerHTML;
            
            const fullPage = `
<!DOCTYPE html>
<html lang="en-GB">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>${title} | Newquay Sundown Walks</title>
    <link rel="stylesheet" href="../style.css"> </head>
<body>
    <header style="background:var(--bg-color);">
        <nav style="max-width:1200px; margin:0 auto; padding:20px; display:flex; justify-content:space-between; align-items:center;">
            <a href="../index.html" style="font-weight:800; font-size:1.2rem; color:var(--primary);">← Back Home</a>
            <a href="../blog.html" class="cta-button secondary">Back to Blog</a>
        </nav>
    </header>

    <main style="padding: 60px 20px;">
        <div class="container premium-glass" style="max-width: 800px; margin: 0 auto; background:white;">
            ${content}
        </div>
    </main>

    <footer style="text-align:center; padding:50px; color:#888;">
        &copy; 2026 Newquay Sundown Walks
    </footer>
</body>
</html>`;

            const blob = new Blob([fullPage], {type: 'text/html'});
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = `${slug}.html`;
            a.click();
        }
    </script>
</body>
</html>
